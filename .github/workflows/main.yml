name: RDP + Sunshine + Moonlight

on:
  workflow_dispatch:

jobs:
  cloud-gaming:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name SecurityLayer -Value 2

          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Configure o secret RDP_PASSWORD"
          }

          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

      - name: Install Tailscale
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/tailscale/tailscale/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -match 'windows-amd64\.msi$' } |
            Select-Object -First 1

          if ($asset) {
            $installer = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest $asset.browser_download_url -OutFile $installer
          } else {
            $installer = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $installer
          }

          $p = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) {
            throw "Falha na instalação do Tailscale: $($p.ExitCode)"
          }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TS_AUTHKEY) {
            throw "Configure o secret TAILSCALE_AUTH_KEY"
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="gh-gta-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao conectar Tailscale"
          }

          $ip = & $ts ip -4
          if (-not $ip) {
            throw "IP Tailscale não encontrado"
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "IP Tailscale: $ip"

      - name: Install Sunshine
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/LizardByte/Sunshine/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -eq "Sunshine-Windows-AMD64-installer.msi" } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Instalador Sunshine não encontrado"
          }

          $installer = "$env:TEMP\sunshine.msi"
          Invoke-WebRequest $asset.browser_download_url -OutFile $installer

          $p = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -PassThru

          if ($p.ExitCode -notin @(0,3010)) {
            throw "Falha ao instalar Sunshine: $($p.ExitCode)"
          }

          Write-Host "Sunshine instalado!"

      - name: Configure Sunshine Firewall
        shell: pwsh
        run: |
          $ports = @(
            @{port="47984-47990";protocol="TCP"},
            @{port="48010";protocol="TCP"},
            @{port="47998-48010";protocol="UDP"}
          )

          foreach ($item in $ports) {
            netsh advfirewall firewall add rule name="Sunshine-Tailscale-$($item.protocol)-$($item.port)" dir=in action=allow protocol=$($item.protocol) localport=$($item.port) remoteip=100.64.0.0/10
          }

      - name: Start Sunshine
        shell: pwsh
        run: |
          $service = Get-Service -Name "SunshineService" -ErrorAction SilentlyContinue

          if ($service) {
            Start-Service -Name "SunshineService" -ErrorAction SilentlyContinue
            Write-Host "Serviço Sunshine iniciado"
          } else {
            Write-Host "Sunshine instalado, mas serviço não encontrado."
            Write-Host "Pode ser necessário iniciá-lo na sessão gráfica."
          }

      - name: Verify RDP
        shell: pwsh
        run: |
          $result = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389

          if (-not $result.TcpTestSucceeded) {
            throw "RDP não está escutando na porta 3389"
          }

          Write-Host "RDP disponível"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Usuário: RDP"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "================================="
          Write-Host "VM GTA V + SUNSHINE"
          Write-Host "================================="
          Write-Host "RDP: $env:TAILSCALE_IP"
          Write-Host "Usuario: RDP"
          Write-Host "Sunshine: https://localhost:47990"
          Write-Host "================================="

          while ($true) {
            Write-Host "[$(Get-Date)] VM ativa"
            Start-Sleep -Seconds 300
          }
